# Publishes the app (the www/ folder) to GitHub Pages as plain files.
# No Jekyll: this is an app, not a blog, so nothing needs building.
#
# One-time setup: repo Settings → Pages → "Build and deployment" → Source: GitHub Actions

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload the app
        uses: actions/upload-pages-artifact@v4
        with:
          path: www

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
