<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Comic Boxes" />
  <title>Comic Boxes</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preload" href="fonts/BarlowCondensed-ExtraBold.woff" as="font" type="font/woff" crossorigin />
  <link rel="preload" href="fonts/PermanentMarker.woff" as="font" type="font/woff" crossorigin />
  <script>
    // Apply the saved theme before anything draws, so there's no flash.
    (function () {
      var t = null;
      try { t = localStorage.getItem('cb.theme'); } catch (e) {}
      if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Library -->
  <div id="library" class="library">
    <header class="topbar">
      <button class="round-btn up" id="upBtn" type="button" aria-label="Back" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="where">
        <nav class="path" id="path" aria-label="Boxes above this one"></nav>
        <h1 class="title" id="title">My boxes</h1>
      </div>
      <button class="round-btn" id="settingsBtn" type="button" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <button class="theme-switch" id="themeSwitch" type="button" role="switch" aria-checked="false" aria-label="Dark theme">
        <span class="thumb" aria-hidden="true">
          <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        </span>
      </button>
      <button class="round-btn add" id="addBtn" type="button" aria-label="Add comics, a folder or a box">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>

    <main class="shelf" id="shelf"></main>

    <input type="file" id="fileInput" multiple hidden />
    <input type="file" id="folderInput" webkitdirectory directory multiple hidden />
  </div>

  <!-- Reader -->
  <div id="reader" class="reader" hidden>
    <div class="stage" id="stage">
      <div class="pages" id="pages"></div>
    </div>
    <header class="reader-bar top" id="readerTop">
      <button class="icon-btn" id="closeReader" type="button" aria-label="Back to box">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h1 class="reader-title" id="readerTitle"></h1>
      <button class="icon-btn" id="spreadBtn" type="button" aria-label="Two-page view" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M3 5h8v14H3zM13 5h8v14h-8z"/></svg>
      </button>
      <button class="icon-btn text-btn" id="dirBtn" type="button" aria-label="Read right to left (manga)" aria-pressed="false">Manga</button>
    </header>
    <footer class="reader-bar bottom" id="readerBottom">
      <input type="range" id="pageSlider" min="1" value="1" aria-label="Page" />
      <span class="page-num" id="pageNum"></span>
    </footer>
  </div>

  <!-- Book reader (EPUB, MOBI, FB2, TXT) -->
  <div id="bookReader" class="reader book-reader" hidden>
    <div class="book-stage" id="bookStage">
      <div class="book-clip" id="bookClip">
        <button class="book-ch-btn" id="bookPrevCh" type="button" hidden></button>
        <div class="book-sheet" id="bookSheet">
          <iframe id="bookFrame" title="Book page" sandbox="allow-same-origin" tabindex="-1"></iframe>
          <div class="book-touch" id="bookTouch"></div>
        </div>
        <button class="book-ch-btn" id="bookNextCh" type="button" hidden></button>
      </div>
      <div class="book-loading" id="bookLoading" hidden>Opening…</div>
      <div class="book-status" aria-hidden="true"><span id="bookStatusLeft"></span><span id="bookStatusRight"></span></div>
    </div>
    <button class="book-back" id="bookBack" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Back
    </button>
    <header class="reader-bar top">
      <button class="icon-btn" id="closeBook" type="button" aria-label="Back to box">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h1 class="reader-title" id="bookTitle"></h1>
      <button class="icon-btn" id="bookTocBtn" type="button" aria-label="Contents" aria-expanded="false" aria-controls="bookToc">
        <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>
      </button>
      <button class="icon-btn text-btn aa-btn" id="bookAaBtn" type="button" aria-label="Text settings: font, size, spacing and colors" aria-expanded="false" aria-controls="bookPanel"><span class="aa-small">A</span>A</button>
    </header>
    <footer class="reader-bar bottom book-bottom">
      <div class="book-where"><span id="bookWhere"></span><span id="bookPage"></span></div>
      <div class="book-progress">
        <input type="range" id="bookSlider" min="0" max="1000" value="0" aria-label="Place in the book" />
        <span class="page-num" id="bookPct"></span>
      </div>
    </footer>
    <div class="book-panel" id="bookPanel" role="dialog" aria-label="Text settings" hidden></div>
    <div class="book-panel toc" id="bookToc" role="dialog" aria-label="Contents" hidden></div>
  </div>

  <!-- Sheet (menus, dialogs) -->
  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>

  <!-- Import progress -->
  <div class="progress-panel" id="progressPanel" role="status" aria-live="polite" hidden>
    <div class="progress-text"><b id="progressCount"></b><span id="progressName"></span></div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="vendor/jszip.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
